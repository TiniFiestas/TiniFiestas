<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Attack On Titan</title>

    <style>
        body {
            background-color: #e6ecff; /* color suave */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1, h2 {
            text-align: center;
        }

        img {
            width: 250px;
            border-radius: 10px;
            border: 3px solid #222;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4); /* sombra en imágenes */
        }

        /* ----- Estilos por sección ----- */

        section {
            padding: 40px;
            margin: 20px;
            border-radius: 15px;
        }

        /* Sección Inicio */
        #inicio {
            background-color: #fff0f0;
            border-left: 8px solid #b30000;
        }

        /* Sección Sobre mí */
        #sobre-mi {
            background-color: #f0fff4;
            border-left: 8px solid #2e8b57;
        }

        /* Sección Galería */
        #galeria {
            background-color: #f0f7ff;
            border-left: 8px solid #1e3a8a;
        }

        p {
            font-family: "Trebuchet MS", sans-serif;
            font-size: 20px;
            text-align: center;
        }

        .center {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1 style="color:#b30000;">Attack On Titan</h1>

    <!-- Sección Inicio -->
    <section id="inicio">
        <h2>Inicio</h2>
        <p>Bienvenido a una página temática de Attack On Titan, un mundo donde la humanidad lucha por sobrevivir.</p>
        <div class="center">
            <img src="imagenes/Aot.jpg" 
                 alt="Inicio - Attack On Titan">
        </div>
    </section>

    <!-- Sección Sobre mí -->
    <section id="sobre-mi">
        <h2>Sobre mí</h2>
        <p>Soy un fan de Attack On Titan y me encanta su historia, personajes y ambientación épica.</p>
        <div class="center">
            <img src="https://upload.wikimedia.org/wikipedia/en/7/70/Attack_on_Titan_character_Eren_Yeager.png" 
                 alt="Eren Yeager">
        </div>
    </section>

    <!-- Sección Galería -->
    <section id="galeria">
        <h2>Galería</h2>
        <p>Aquí puedes ver algunas imágenes representativas de la serie.</p>
        <div class="center">
            <img src="https://upload.wikimedia.org/wikipedia/en/7/73/Attack_on_Titan_S3_Part_1_poster.png" 
                 alt="Galería AoT">
        </div>
    </section>

</body>
</html>
